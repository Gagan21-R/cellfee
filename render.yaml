# Render Blueprint: one free web service built from the Dockerfile.  Render -> New -> Blueprint -> this repo.
services:
  - type: web
    name: cellfee
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # optional: the site runs without them; only live QpiAI Opt / QCloud SDK runs need the keys.
      # sync: false -> Render asks for the value in its dashboard; it is never stored in this file.
      - key: QPIAI_QCLOUD_API_KEY
        sync: false
      - key: QPIAI_OPT_API_KEY
        sync: false
